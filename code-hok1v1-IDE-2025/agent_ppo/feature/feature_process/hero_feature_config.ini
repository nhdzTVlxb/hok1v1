[feature_config]
; Basic hero status
is_hero_alive = one_hot:1:eq
location_x = min_max:-60000:60000
location_z = min_max:-60000:60000

; Hero stats
level = min_max:1:15
exp = min_max:0:1984
money = min_max:0:3000
revive_time = min_max:0:60
killCnt = min_max:0:10
deadCnt = min_max:0:10
assistCnt = min_max:0:10
moneyCnt = min_max:0:20000
totalHurt = min_max:0:200000
totalHurtToHero = min_max:0:100000
totalBeHurtByHero = min_max:0:100000

; Status flags
isInGrass = one_hot:1:eq
canBuyEquip = one_hot:1:eq

; Actor state attributes
is_main_camp = one_hot:1:eq
hp = min_max:0:6000
max_hp = min_max:0:6000
attack_range = min_max:0:15000
attack_target = min_max:0:3
kill_income = min_max:0:500
sight_area = min_max:0:15000
is_visible = one_hot:1:eq

; Actor values (combat stats)
phy_atk = min_max:0:1000
phy_def = min_max:0:300
mov_spd = min_max:0:8000
atk_spd = min_max:0:10000
ep = min_max:0:2000
max_ep = min_max:0:2000
hp_recover = min_max:0:100
ep_recover = min_max:0:100
phy_armor_hurt = min_max:0:100
crit_rate = min_max:0:100
crit_effe = min_max:0:300
phy_vamp = min_max:0:2000
cd_reduce = min_max:0:2500

; Skill features (for each skill slot 0-6)
# skill_0 is passive skill 
skill_0_level = one_hot:1:eq 
skill_0_usable = one_hot:1:eq
skill_0_cooldown = min_max:0:1089
skill_0_cooldown_max = min_max:0:1089
skill_1_level = min_max:0:6 
skill_1_usable = one_hot:1:eq
skill_1_cooldown = min_max:0:5000
skill_1_cooldown_max = min_max:0:5000
skill_2_level = min_max:0:6
skill_2_usable = one_hot:1:eq
skill_2_cooldown = min_max:0:8000
skill_2_cooldown_max = min_max:0:8000
skill_3_level = min_max:0:3
skill_3_usable = one_hot:1:eq
skill_3_cooldown = min_max:0:25000
skill_3_cooldown_max = min_max:0:25000
# skill_4 is recovery
skill_4_level = one_hot:1:eq 
skill_4_usable = one_hot:1:eq
skill_4_cooldown = min_max:0:60000
skill_4_cooldown_max = min_max:0:60000
# skill_5 is dash
skill_5_level = one_hot:1:eq 
skill_5_usable = one_hot:1:eq
skill_5_cooldown = min_max:0:120000
skill_5_cooldown_max = min_max:0:120000
# skill_6 is go back to spring
skill_6_level = one_hot:1:eq 
skill_6_usable = one_hot:1:eq
skill_6_cooldown = one_hot:1:eq
skill_6_cooldown_max = one_hot:1:eq

[feature_functions]
